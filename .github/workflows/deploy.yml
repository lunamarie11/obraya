name: Deploy a produccion

# Automatiza lo que hasta ahora se hacia a mano (build de Docker, push a
# ECR, conectar por SSM, levantar contenedores, migrar, smoke test) -- ver
# docs/backlog-salida-produccion.md punto 6. Corre solo despues de que el
# workflow "CI" termine en verde sobre main (no re-corre lint/test, confia
# en ese resultado).
#
# Usa OIDC (sin credenciales de AWS guardadas como secret estatico) -- ver
# infra/terraform/github-oidc.tf para el role que este workflow asume.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {} # para poder re-disparar un deploy a mano sin nuevo commit

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: 083664493768.dkr.ecr.sa-east-1.amazonaws.com
  # Instancia EC2 unica de produccion (ver infra/terraform/ec2.tf, ADR-020).
  INSTANCE_ID: i-041a8665a0055ce26

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolver el SHA que se esta deployando
        id: vars
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login a ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      # La instancia EC2 es Graviton (t4g, arquitectura arm64) -- buildear
      # para amd64 (default de los runners de GitHub) hace que el
      # contenedor falle al arrancar con "exec format error".
      - name: Build y push imagen backend (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/obraya-backend:latest
            ${{ env.ECR_REGISTRY }}/obraya-backend:${{ steps.vars.outputs.sha }}

      - name: Build y push imagen frontend (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/obraya-frontend:latest
            ${{ env.ECR_REGISTRY }}/obraya-frontend:${{ steps.vars.outputs.sha }}

      - name: Recrear contenedores en produccion via SSM
        run: |
          set -euo pipefail

          run_remote() {
            local script="$1"
            local params
            params=$(jq -n --arg cmd "$script" '{commands: [$cmd]}')
            local cmd_id
            cmd_id=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "$params" \
              --query "Command.CommandId" --output text)
            if ! aws ssm wait command-executed --command-id "$cmd_id" --instance-id "$INSTANCE_ID"; then
              echo "--- SSM command failed, output: ---"
              aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
                --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}"
              exit 1
            fi
            aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
              --query "StandardOutputContent" --output text
          }

          run_remote "cd /opt/obraya && \
            export ECR_BACKEND_IMAGE=${ECR_REGISTRY}/obraya-backend:${{ steps.vars.outputs.sha }} && \
            export ECR_FRONTEND_IMAGE=${ECR_REGISTRY}/obraya-frontend:${{ steps.vars.outputs.sha }} && \
            aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY} && \
            docker-compose -f docker-compose.prod.yml pull backend frontend && \
            docker-compose -f docker-compose.prod.yml up -d backend frontend"

          run_remote "cd /opt/obraya && \
            docker-compose -f docker-compose.prod.yml exec -T backend sh -c 'cd packages/backend && npm run migration:run'"

          run_remote "for i in \$(seq 1 12); do \
            STATUS=\$(docker inspect --format='{{.State.Health.Status}}' obraya-backend 2>/dev/null || echo missing); \
            if [ \"\$STATUS\" = healthy ]; then echo 'backend healthy'; exit 0; fi; \
            sleep 5; \
          done; echo \"backend no llego a healthy, status final: \$STATUS\"; exit 1"
